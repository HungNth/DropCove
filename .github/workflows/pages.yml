name: Deploy Pages

on:
  push:
    branches:
      - main
    paths:
      - website/**
      - scripts/build-pages.mjs
      - .github/workflows/pages.yml
  workflow_dispatch:
    inputs:
      tag:
        description: Optional published release tag (for example v0.1.0)
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      tag:
        description: Published release tag to target
        required: false
        default: ""
        type: string

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >
          node scripts/build-pages.mjs
          --source website
          --out _site
          --repo "${{ github.server_url }}/${{ github.repository }}"
          --tag "${{ inputs.tag }}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
