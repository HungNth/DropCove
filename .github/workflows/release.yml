name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Optional synthetic vMAJOR.MINOR.PATCH tag to validate without publishing
        required: false
        default: ""
        type: string

permissions: {}

jobs:
  package:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      zip_path: build/DropCove-Setup-${{ steps.meta.outputs.version }}.zip
      publish: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Rust and cargo-xwin
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install cargo-xwin
        run: cargo install cargo-xwin --locked

      - name: Verify version and tag invariants
        id: meta
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $tag = if ("${{ github.event_name }}" -eq "push") { "${{ github.ref_name }}" } elseif ("${{ inputs.tag }}") { "${{ inputs.tag }}" } else { "v$version" }
          node scripts/release-check.mjs verify --tag "$tag"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend test suite
        run: pnpm test

      - name: Build installer via cargo-xwin
        run: |
          pnpm tauri build --runner cargo-xwin --target x86_64-pc-windows-msvc
          node scripts/copy-installer.cjs

      - name: Fail if build modified tracked manifests
        run: git diff --exit-code -- VERSION package.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json

      - name: Package and verify ZIP archive
        run: node scripts/release-check.mjs package-zip

      - name: Upload validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: DropCove-Setup-${{ steps.meta.outputs.version }}
          path: build/DropCove-Setup-${{ steps.meta.outputs.version }}.zip
          if-no-files-found: error

  publish-release:
    needs: package
    if: needs.package.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified ZIP artifact
        uses: actions/download-artifact@v4
        with:
          name: DropCove-Setup-${{ needs.package.outputs.version }}
          path: dist-release

      - name: Refuse release or asset collision
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.package.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite." >&2
            exit 1
          fi

      - name: Create stable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.package.outputs.tag }}
          ZIP: dist-release/DropCove-Setup-${{ needs.package.outputs.version }}.zip
        run: |
          gh release create "$TAG" "$ZIP" \
            --repo "${{ github.repository }}" \
            --title "$TAG" \
            --generate-notes

  deploy-pages:
    needs: [package, publish-release]
    if: needs.package.outputs.publish == 'true'
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      tag: ${{ needs.package.outputs.tag }}
