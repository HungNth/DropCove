[package]
name = "dropcove"
version = "0.0.22"
description = "A resident Windows utility providing a temporary drag-and-drop workspace for file and folder references."
authors = ["HungNth"]
repository = "https://github.com/HungNth/DropCove"
edition = "2021"

[lib]
name = "dropcove_lib"
[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-opener = "2.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
rusqlite = { version = "0.40", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
tauri-plugin-notification = "2"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_HiDpi",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_DataExchange",
    "Win32_System_Registry",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
webview2-com = "0.39.1"
windows-core = "0.62.2"
