[package]
name = "dropcove"
version = "0.0.1"
description = "DropCove Resident Workspace"
authors = ["DropCove Contributors"]
edition = "2021"

[lib]
name = "dropcove_lib"
[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-opener = "2.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
